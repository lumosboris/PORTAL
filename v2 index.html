<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05030a">
<meta name="mobile-web-app-capable" content="yes">
<title>Masa Ekranı</title>
<style>
:root{--ink:#f1edff;--dim:rgba(241,237,255,.6);--acc:#b58cff;--acc2:#6ff0d0;--mc:rgb(150,110,255)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;
 background:radial-gradient(ellipse at 50% 35%,#170d2b 0%,#08050f 60%,#030208 100%)}
#cv{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;display:block}
.scene{position:fixed;top:0;left:0;right:0;bottom:0;z-index:2;display:none}
.scene.show{display:block}
.rise{opacity:0}
.scene.show .rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.scene.show .d1{animation-delay:.12s}.scene.show .d2{animation-delay:.24s}.scene.show .d3{animation-delay:.36s}.scene.show .d4{animation-delay:.48s}
@keyframes rise{from{opacity:0;transform:translateY(4vmin)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.25}}

/* ---------- MÜZİK ---------- */
#mbgw{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;opacity:0;transition:opacity 1.2s}
body.sc-music #mbgw{opacity:1}
#mbg{position:absolute;top:-15%;left:-15%;width:130%;height:130%;object-fit:cover;filter:blur(40px) saturate(1.6) brightness(.5);opacity:0;transition:opacity 1.2s}
#mbg.on{opacity:1}
#mshade{position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 25% 50%,rgba(0,0,0,0) 0,rgba(0,0,0,.3) 55%,rgba(0,0,0,.72) 100%)}
.mgrid{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;gap:7vmin;padding:6vmin 8vmin 12vmin 7vmin}
#cover{position:relative;width:50vmin;height:50vmin;flex:none}
#disc{position:absolute;top:4%;left:4%;width:92%;height:92%;transform:translateX(0);transition:transform 1.1s cubic-bezier(.3,.8,.2,1)}
#disc.in{transform:translateX(36%)}
#spin{width:100%;height:100%;border-radius:50%;animation:spin 3.2s linear infinite;box-shadow:0 0 5vmin rgba(0,0,0,.7);
 background:radial-gradient(circle,#0c0c0c 0 3%,transparent 3.5%),repeating-radial-gradient(circle,#101010 0 1.5px,#1e1e1e 1.5px 3px);position:relative}
#spin:after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 10%,rgba(255,255,255,.1) 14%,transparent 20% 60%,rgba(255,255,255,.07) 64%,transparent 70%)}
#mlabel{position:absolute;top:32%;left:32%;width:36%;height:36%;border-radius:50%;object-fit:cover;background:var(--mc)}
body.paused #spin{animation-play-state:paused}
#mart{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;border-radius:2.4vmin;background:linear-gradient(135deg,var(--mc),#1a1030);box-shadow:0 2vmin 7vmin rgba(0,0,0,.65);opacity:0;transition:opacity .8s}
#mart.on{opacity:1}
#mtext{flex:1;min-width:0}
#mtitle{font-size:5.2vmin;font-weight:800;line-height:1.1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#martist{font-size:2.8vmin;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;margin-top:1.2vmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#martist:before{content:"";display:inline-block;width:1.4vmin;height:1.4vmin;border-radius:50%;background:#1ed760;margin-right:1.4vmin;vertical-align:middle;box-shadow:0 0 1.5vmin #1ed760}
#mlyr{margin-top:5vmin}
#ml0{font-size:3vmin;color:rgba(255,255,255,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.2em}
#ml1{font-size:6.8vmin;font-weight:800;line-height:1.14;margin-top:1.4vmin;text-shadow:0 0 4vmin var(--mc);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:1.2em}
#ml2{font-size:3.4vmin;color:rgba(255,255,255,.45);margin-top:1.8vmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.2em}
#mlyr.go #ml1{animation:lin .65s cubic-bezier(.2,.8,.2,1)}
#mlyr.go #ml0,#mlyr.go #ml2{animation:fin .65s}
@keyframes lin{from{opacity:0;transform:translateY(3.5vmin) scale(.97)}to{opacity:1;transform:none}}
@keyframes fin{from{opacity:0}to{opacity:1}}
#mprog{position:absolute;left:7vmin;right:8vmin;bottom:5vmin;display:flex;align-items:center;gap:2vmin;font-size:2.2vmin;color:var(--dim);font-variant-numeric:tabular-nums}
#mbar{flex:1;height:.6vmin;background:rgba(255,255,255,.15);border-radius:1vmin;overflow:hidden}
#mfill{height:100%;background:linear-gradient(90deg,var(--mc),#fff);transform-origin:0 50%;transform:scaleX(0)}
/* plak modu */
body.vinyl #mart{display:none}
body.vinyl #disc,body.vinyl #disc.in{transform:none;top:5%;left:5%;width:90%;height:90%}
body.vinyl #mlabel{top:29%;left:29%;width:42%;height:42%;box-shadow:0 0 0 .6vmin #0c0c0c}
body.vinyl #mbar{visibility:hidden}
#ring{position:absolute;top:0;left:0;width:100%;height:100%;display:none;transform:rotate(-90deg);overflow:visible}
body.vinyl #ring{display:block}
#arm{display:none;position:absolute;top:-3%;right:-5%;width:6vmin;height:34vmin;z-index:3;transform-origin:50% 3vmin;transform:rotate(20deg);transition:transform 1.4s cubic-bezier(.3,.8,.2,1)}
body.vinyl #arm{display:block}
body.vinyl.paused #arm{transform:rotate(3deg)}
#arm i{position:absolute;left:50%;display:block}
#arm .pv{top:0;width:6vmin;height:6vmin;margin-left:-3vmin;border-radius:50%;background:radial-gradient(circle,#eee 0 28%,#999 30% 60%,#555 62%);box-shadow:0 .5vmin 1.5vmin rgba(0,0,0,.6)}
#arm .rod{top:3vmin;width:.9vmin;margin-left:-.45vmin;height:26vmin;background:linear-gradient(90deg,#8a8a8a,#f2f2f2,#8a8a8a);border-radius:.5vmin}
#arm .hd{top:28vmin;width:3.2vmin;height:5vmin;margin-left:-1.6vmin;background:#2a2a2a;border-radius:.6vmin;border-top:.7vmin solid #bbb}
/* gece modu */
.nwrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:rgba(190,180,255,.5);transition:left 3s ease-in-out,top 3s ease-in-out}
#nclock{font-size:24vmin;font-weight:100;line-height:1;font-variant-numeric:tabular-nums}
#ninfo{font-size:2.6vmin;letter-spacing:.3em;margin-top:2vmin}
#mclock{position:absolute;top:4vmin;right:7vmin;font-size:3.4vmin;font-weight:300;color:var(--dim);letter-spacing:.1em}

/* ---------- HAVA ---------- */
.wgrid{position:absolute;top:0;left:0;right:0;bottom:8vmin;display:grid;grid-template-columns:1.05fr 1fr;grid-template-rows:minmax(0,1fr) auto;gap:2.6vmin;padding:4.5vmin 5.5vmin 3vmin}
.wmain{display:flex;flex-direction:column;justify-content:center}
.wloc{font-size:2.2vmin;letter-spacing:.45em;color:var(--acc)}
#wtime{font-size:2.4vmin;color:var(--dim);margin-top:.8vmin;letter-spacing:.1em}
.wbig{display:flex;align-items:center;gap:2vmin;margin-top:1vmin}
#wicon{width:19vmin;height:19vmin;flex:none}
#wicon svg,.hr svg{width:100%;height:100%;overflow:visible}
#wtemp{font-size:17vmin;font-weight:200;line-height:1;letter-spacing:-.03em}
#wdesc{font-size:4vmin;font-weight:600}
#whilo{font-size:2.6vmin;color:var(--dim);margin-top:.8vmin}
.wside{display:grid;grid-template-columns:1fr 1fr;gap:1.8vmin;align-content:center}
.tile{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:2.4vmin;padding:1.8vmin 2.2vmin}
.tile .k{font-size:1.8vmin;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.tile .v{font-size:3.8vmin;font-weight:300;margin-top:.4vmin}
.tile .v small{font-size:2vmin;color:var(--dim)}
.twind{grid-column:1/-1;display:flex;align-items:center;gap:2.4vmin}
#compass{width:14vmin;height:14vmin;flex:none;overflow:visible}
.tag{display:inline-block;margin-top:.8vmin;padding:.4vmin 1.4vmin;border-radius:3vmin;font-size:1.9vmin;background:rgba(111,240,208,.12);color:var(--acc2);border:1px solid rgba(111,240,208,.3)}
.hours{grid-column:1/-1;display:flex;gap:1.6vmin}
.hr{flex:1;text-align:center;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:2vmin;padding:1.2vmin .5vmin}
.hr .h{font-size:1.9vmin;color:var(--dim)}
.hr .i{width:6.5vmin;height:6.5vmin;margin:.4vmin auto}
.hr .ht{font-size:2.8vmin}
.hr .p{font-size:1.7vmin;color:#8fc8ff;min-height:1.2em}
.spin{transform-origin:32px 32px;animation:spin 24s linear infinite}
.drift{animation:drift 5s ease-in-out infinite alternate}
.drop{animation:drop 1.1s linear infinite}
.flash{animation:flash 3.2s infinite}
.fogl{animation:fogl 4s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-2px)}to{transform:translateX(3px)}}
@keyframes drop{from{transform:translateY(-3px);opacity:0}30%{opacity:1}to{transform:translateY(9px);opacity:0}}
@keyframes flash{0%,86%,92%,100%{opacity:0}88%,95%{opacity:1}}
@keyframes fogl{from{transform:translateX(-4px)}to{transform:translateX(4px)}}

/* ---------- SÖZ ---------- */
.qwrap{position:absolute;top:0;left:0;right:0;bottom:8vmin;display:flex;flex-direction:column;justify-content:center;padding:0 12vmin}
.qtag{font-size:2.2vmin;letter-spacing:.55em;color:var(--acc2)}
.qmark{font-family:Georgia,serif;font-size:24vmin;line-height:1;height:12vmin;color:var(--acc);opacity:.55;margin-top:1vmin}
#qtext{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:7.2vmin;line-height:1.25;text-shadow:0 0 5vmin rgba(181,140,255,.35)}
#qauth{margin-top:3.5vmin;font-size:2.8vmin;color:var(--dim);letter-spacing:.18em}
#qauth:before{content:"";display:inline-block;width:6vmin;height:1px;background:var(--acc);vertical-align:middle;margin-right:2vmin}

/* ---------- GÖKYÜZÜ / ROBOT katmanları ---------- */
.l3{position:absolute;left:5vmin;bottom:12vmin;display:flex;align-items:stretch;box-shadow:0 1vmin 4vmin rgba(0,0,0,.4)}
.l3 .tg{background:var(--acc2);color:#07131a;font-weight:800;padding:1vmin 2vmin;font-size:2.3vmin;letter-spacing:.2em;display:flex;align-items:center}
.l3 .tx{background:rgba(8,6,20,.72);padding:1vmin 2.4vmin;font-size:3.2vmin}
body.locked .ov{display:none}
#bubble{position:absolute;max-width:42vw;background:#fff;color:#1b1430;border-radius:3vmin;padding:1.6vmin 2.4vmin;font-size:2.9vmin;font-weight:600;line-height:1.3;
 transform:translate(-100%,-100%);box-shadow:0 1vmin 3vmin rgba(0,0,0,.4);transition:opacity .35s}
#bubble:after{content:"";position:absolute;right:10%;bottom:-1.5vmin;border-left:1.2vmin solid transparent;border-right:1.2vmin solid transparent;border-top:1.6vmin solid #fff}
#bubble.hide{opacity:0}

/* ---------- ALT BANT (bülten) ---------- */
#ticker{position:fixed;left:0;right:0;bottom:0;height:8vmin;z-index:6;display:flex;align-items:stretch;background:rgba(6,4,16,.86);border-top:1px solid var(--acc);transform:translateY(105%);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
body.tk #ticker{transform:none}
#tkl{display:flex;align-items:center;gap:1.2vmin;padding:0 2.4vmin;background:var(--acc);text-shadow:0 1px 2px rgba(0,0,0,.4);font-weight:800;font-size:2.3vmin;letter-spacing:.15em;color:#fff;flex:none}
#tkl b{width:1.4vmin;height:1.4vmin;border-radius:50%;background:#ff4d6d;animation:blink 1.2s infinite}
#tkc{display:flex;align-items:center;padding:0 2.4vmin;font-size:3.4vmin;font-weight:300;background:rgba(255,255,255,.06);flex:none;font-variant-numeric:tabular-nums}
#tkm{flex:1;overflow:hidden;display:flex;align-items:center}
#tkt{white-space:nowrap;font-size:2.7vmin;padding-left:100%;animation:mq 60s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}

/* ---------- DRONE ---------- */
.dr{display:flex;align-items:center;gap:1.6vmin;margin-top:2vmin;padding:1.2vmin 2vmin;border-radius:2vmin;border:1px solid;max-width:100%}
.dr .dri{width:6vmin;height:6vmin;flex:none}
.dr b{display:block;font-size:2.6vmin;letter-spacing:.12em}
.dr span{display:block;font-size:2vmin;opacity:.85;margin-top:.3vmin}
.dr.green,.pill.green{color:#5cf2a0;border-color:rgba(92,242,160,.5);background:rgba(92,242,160,.1)}
.dr.amber,.pill.amber{color:#ffc857;border-color:rgba(255,200,87,.55);background:rgba(255,200,87,.12)}
.dr.red,.pill.red{color:#ff5a6e;border-color:#ff5a6e;background:rgba(255,50,80,.18);animation:redp 1.6s ease-in-out infinite}
@keyframes redp{50%{box-shadow:0 0 3vmin rgba(255,60,90,.55);background:rgba(255,50,80,.3)}}
.dr.red .dri{animation:shake .5s ease-in-out infinite alternate}
@keyframes shake{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.pill{display:flex;align-items:center;gap:1vmin;padding:0 2vmin;font-size:2.2vmin;font-weight:800;letter-spacing:.1em;flex:none;border-left:1px solid;border-right:1px solid}
.pill .dri{width:3.6vmin;height:3.6vmin}
.l3 .pill{border:0;padding:0 2vmin}
body.drred .twind{border-color:#ff5a6e;box-shadow:inset 0 0 3vmin rgba(255,60,90,.25)}
.hidden{display:none!important}

/* ---------- MENÜ ---------- */
#tapzone{position:fixed;left:0;right:0;bottom:0;height:20vh;z-index:20}
#dock{position:fixed;left:3vmin;right:3vmin;bottom:3vmin;z-index:30;background:rgba(14,9,30,.94);border:1px solid var(--acc);border-radius:3vmin;padding:2.2vmin;
 transform:translateY(135%);transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 -2vmin 8vmin rgba(0,0,0,.6)}
#dock.open{transform:none}
#dock h3{font-size:1.9vmin;letter-spacing:.4em;color:var(--dim);margin:0 0 1.6vmin 1vmin;font-weight:600}
#tiles{display:flex;gap:1.6vmin;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#tiles::-webkit-scrollbar{display:none}
.t{flex:none;width:14.5vmin;height:14.5vmin;border-radius:2.4vmin;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--ink);
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vmin;font:inherit;font-size:1.9vmin;font-weight:600}
.t span{font-size:5vmin;line-height:1}
.t.on{background:linear-gradient(160deg,rgba(181,140,255,.5),rgba(111,240,208,.25));border-color:var(--acc)}
#hint{position:fixed;left:50%;bottom:10vmin;transform:translateX(-50%);z-index:25;background:rgba(10,6,24,.85);border:1px solid rgba(181,140,255,.4);padding:1.2vmin 2.6vmin;border-radius:4vmin;font-size:2.4vmin;transition:opacity 1s;pointer-events:none}
#hint.off{opacity:0}
#wipe{position:fixed;top:-10%;height:120%;left:0;width:170vw;z-index:40;pointer-events:none;transform:translateX(-180vw) skewX(-12deg);
 background:linear-gradient(90deg,var(--acc2) 0 4%,var(--acc) 4% 10%,#0b0718 10% 90%,var(--acc) 90% 96%,var(--acc2) 96%)}
#wipe.go{animation:wipe .95s cubic-bezier(.7,0,.3,1) forwards}
@keyframes wipe{from{transform:translateX(-180vw) skewX(-12deg)}to{transform:translateX(115vw) skewX(-12deg)}}

/* ---------- AYARLAR ---------- */
#settings{position:fixed;z-index:50;top:50%;left:50%;transform:translate(-50%,-50%);width:92vw;max-width:560px;max-height:92vh;overflow:auto;display:none;
 background:#120b22;border:1px solid rgba(181,140,255,.45);border-radius:16px;padding:20px;font-size:14px;line-height:1.5;-webkit-user-select:text;user-select:text;box-shadow:0 20px 80px rgba(0,0,0,.7)}
#settings.show{display:block}
#settings h2{font-size:18px;margin-bottom:8px}
#settings label{display:block;margin:12px 0 4px;color:var(--dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
#settings label.cb{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
#settings input,#settings select{width:100%;font:inherit;color:var(--ink);background:#1d1334;border:1px solid rgba(181,140,255,.3);border-radius:8px;padding:9px 10px}
#settings input[type=checkbox]{width:auto}
.three{display:flex;gap:10px}.three>div{flex:1}
#settings code{display:block;padding:9px 10px;background:#0b0716;border-radius:8px;word-break:break-all;color:var(--acc2)}
#settings .row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
#settings .row button{flex:1;font:inherit;font-weight:600;padding:10px;border-radius:8px;border:1px solid rgba(181,140,255,.4);background:#241640;color:var(--ink)}
#settings .row button.pri{background:#1ed760;color:#08140c;border-color:#1ed760}
#sstat{margin-top:10px;font-size:13px;color:#ffb3c8;min-height:1em}
#sstat.ok{color:var(--acc2)}
.two{display:flex;gap:10px}.two>div{flex:1}

@media (orientation:portrait){
 .mgrid{flex-direction:column;justify-content:center;gap:4vmin;padding:8vmin 6vmin 22vmin}
 #cover{width:60vmin;height:60vmin}
 #disc{display:none}
 #mtext{flex:none;width:100%;text-align:center}
 .wgrid{grid-template-columns:1fr;grid-template-rows:auto auto auto}
 .hours .hr:nth-child(n+5){display:none}
}
</style>
</head>
<body>
<div id="mbgw"><img id="mbg" alt=""><div id="mshade"></div></div>
<canvas id="cv"></canvas>

<!-- MÜZİK -->
<section class="scene" id="sc-music">
 <div class="mgrid">
  <div id="cover" class="rise"><div id="disc"><div id="spin"><img id="mlabel" alt=""></div></div><img id="mart" alt=""><svg id="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="49" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1.2"/><circle id="ringp" cx="50" cy="50" r="49" fill="none" style="stroke:var(--mc)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="307.9" stroke-dashoffset="307.9"/></svg><div id="arm"><i class="pv"></i><i class="rod"></i><i class="hd"></i></div></div>
  <div id="mtext">
   <div id="mtitle" class="rise d1">—</div>
   <div id="martist" class="rise d2">—</div>
   <div id="mlyr" class="rise d3"><div id="ml0"></div><div id="ml1"></div><div id="ml2"></div></div>
  </div>
 </div>
 <div id="mclock"></div>
 <div id="mprog"><span id="mcur">0:00</span><div id="mbar"><div id="mfill"></div></div><span id="mdur">0:00</span></div>
</section>

<!-- HAVA -->
<section class="scene" id="sc-weather">
 <div class="wgrid">
  <div class="wmain">
   <div class="wloc rise">KÜÇÜKÇEKMECE · İSTANBUL</div>
   <div id="wtime" class="rise"></div>
   <div class="wbig rise d1"><div id="wicon"></div><div id="wtemp">--°</div></div>
   <div id="wdesc" class="rise d2">Hava yükleniyor…</div>
   <div id="whilo" class="rise d2"></div>
   <div id="drone" class="dr hidden rise d3"><svg viewBox="0 0 48 48" class="dri"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M14 14l20 20M34 14L14 34"/><ellipse cx="10" cy="10" rx="7" ry="2.2"/><ellipse cx="38" cy="10" rx="7" ry="2.2"/><ellipse cx="10" cy="38" rx="7" ry="2.2"/><ellipse cx="38" cy="38" rx="7" ry="2.2"/></g><rect x="18" y="18" width="12" height="12" rx="3" fill="currentColor"/></svg><div><b id="drt"></b><span id="drr"></span></div></div>
  </div>
  <div class="wside">
   <div class="tile twind rise d1">
    <svg id="compass" viewBox="0 0 100 100">
     <circle cx="50" cy="50" r="47" fill="rgba(20,10,40,.4)" stroke="rgba(181,140,255,.35)" stroke-width="1.2"/>
     <g id="ticks"></g>
     <g font-size="10" font-weight="700" fill="rgba(233,228,255,.75)" text-anchor="middle" font-family="system-ui,sans-serif">
      <text x="50" y="17">K</text><text x="85" y="54">D</text><text x="50" y="91">G</text><text x="15" y="54">B</text></g>
     <g id="needle"><polygon points="50,14 57,55 50,49 43,55" fill="#6ff0d0"/><polygon points="50,86 55,57 50,61 45,57" fill="rgba(233,228,255,.3)"/></g>
     <circle cx="50" cy="50" r="3.5" fill="#e9e4ff"/>
    </svg>

function getToken(){

  .catch(function(e){if(e&&e.error==='invalid_grant'){tok={};LS.del('tok');return null}throw e});

var pollT=null;
function poll(){
 clearTimeout(pollT);
 if(location.hash==='#demo'){demo();return}
 var next=8000;
 getToken().then(function(t){
  if(!t)return null;
  return fetch('https://api.spotify.com/v1/me/player/currently-playing?additional_types=episode',{headers:{Authorization:'Bearer '+t}}).then(function(r){
   if(r.status===204||r.status===202){noTrack();return}
   if(r.status===401){tok.exp=0;next=1000;return}
   if(r.status===429){next=(+r.headers.get('Retry-After')||30)*1000;return}
   if(!r.ok)return;
   return r.json().then(function(d){onData(d);next=d.is_playing?3000:8000});
  });
 }).catch(function(){next=10000}).then(function(){pollT=setTimeout(poll,next)});
}

function parseLrc(txt){var out=[],re=/\[(\d+):(\d+(?:\.\d+)?)\]/g;

  if(!ts.length)return;var text=line.replace(/\[[^\]]*\]/g,'').trim()||'♪';ts.forEach(function(t){out.push({t:t,text:text})})});
 return out.sort(function(a,b){return a.t-b.t})}
function clean(n){return n.replace(/\s*[-–]\s*(\d{4}\s*)?(remaster|remastered|version|edit|live|mono|stereo|radio|single).*$/i,'').replace(/\s*\((feat|ft|with|remaster)[^)]*\)/i,'').trim()}
function lrc(path,params){return fetch('https://lrclib.net/api/'+path+'?'+new URLSearchParams(params).toString()).then(function(r){return r.ok?r.json():null}).catch(function(){return null})}
function loadLyrics(tr){
 var id=tr.id;S.lyr={id:id,msg:'Sözler aranıyor…'};
 lrc('get',{artist_name:tr.artist1,track_name:tr.name,album_name:tr.album,duration:Math.round(tr.dur/1000)}).then(function(j){
  if(j&&(j.syncedLyrics||j.plainLyrics||j.instrumental))return j;
  return lrc('search',{track_name:clean(tr.name),artist_name:tr.artist1}).then(function(arr){
   if(!arr||!arr.length)return null;var good=arr.filter(function(x){return Math.abs((x.duration||0)*1000-tr.dur)<8000}),pool=good.length?good:arr;
   return pool.filter(function(x){return x.syncedLyrics})[0]||pool[0]});
 }).then(function(j){
  if(!S.track||S.track.id!==id)return;
  if(j&&j.instrumental)S.lyr={id:id,msg:'♪ Enstrümantal ♪'};
  else if(j&&j.syncedLyrics)S.lyr={id:id,lines:parseLrc(j.syncedLyrics)};
  else if(j&&j.plainLyrics)S.lyr={id:id,plain:j.plainLyrics.split(/\r?\n/).filter(function(x){return x.trim()})};
  else S.lyr={id:id,msg:'♪'};S.lyrKey='';

}

 var fr=T.dur?pos/T.dur:0;$('mfill').style.transform='scaleX('+fr.toFixed(4)+')';$('ringp').setAttribute('stroke-dashoffset',(307.9*(1-fr)).toFixed(1));

 var L=S.lyr,key,get;if(!L||L.id!==T.id)return;
 if(L.lines){var p=pos+S.offset+200,i=-1,ls=L.lines;for(var k=0;k<ls.length;k++){if(ls[k].t<=p)i=k;else break}
  key=L.id+':'+i;if(key===S.lyrKey)return;S.lyrKey=key;get=function(n){return n>=0&&n<ls.length?ls[n].text:''};
  if(i<0)setLines('','♪ ♪ ♪',get(0));else setLines(get(i-1),get(i),get(i+1));}

  get=function(m){return m>=0&&m<n?L.plain[m]:''};setLines(get(j-1),get(j),get(j+1));}

function markTiles(){var cur=S.lock||'auto',b=document.querySelectorAll('.t');for(var i=0;i<b.length;i++)b[i].classList.toggle('on',b[i].getAttribute('data-id')===cur)}
var dockT=null;
function openDock(){markTiles();$('dock').classList.add('open');clearTimeout(dockT);dockT=setTimeout(closeDock,9000)}
function closeDock(){$('dock').classList.remove('open');clearTimeout(dockT)}
$('tiles').addEventListener('click',function(e){var b=e.target.closest('.t');if(!b)return;e.stopPropagation();var id=b.getAttribute('data-id');
 if(id==='set'){closeDock();openSettings();return}
 if(id==='vinyl'){S.style=S.style==='vinyl'?'cover':'vinyl';LS.set('mstyle',S.style);document.body.classList.toggle('vinyl',S.style==='vinyl');flashHint(S.style==='vinyl'?'Müzik: plak görünümü 💿':'Müzik: kapak görünümü');closeDock();return}
 if(id==='auto'){S.lock=null;LS.del('lock')}else{S.lock=id;LS.set('lock',id)}
 markTiles();setTimeout(closeDock,350);document.body.classList.toggle('locked',!!S.lock);
 var target=wanted();if(target===S.scene){document.body.classList.toggle('tk',!S.lock&&target!=='music'&&target!=='night')}else go(target)});
$('tapzone').addEventListener('click',function(e){e.stopPropagation();goFull();$('dock').classList.contains('open')?closeDock():openDock()});
document.addEventListener('click',function(e){
 if($('settings').classList.contains('show'))return;goFull();
 if($('dock').classList.contains('open')&&!e.target.closest('#dock')){closeDock();return}
 if(S.scene==='robot'&&RB){RB.tapAt=Date.now();sayBubble(['Hey! Gıdıklandım 😄','Yaşasın, biri bana dokundu! 💖','Merhaba! 👋'][(Math.random()*3)|0]);RB.nextMsg=Date.now()+4000}
});
function flashHint(t){var h=$('hint');h.textContent=t;h.classList.remove('off');clearTimeout(flashHint.t);flashHint.t=setTimeout(function(){h.classList.add('off')},5000)}
function goFull(){var e=document.documentElement;if(!document.fullscreenElement&&e.requestFullscreen)e.requestFullscreen().catch(function(){});wake()}
var wl=null;function wake(){try{if('wakeLock' in navigator&&!wl)navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null})}).catch(function(){})}catch(e){}}

/* ================= AYARLAR ================= */
function openSettings(){$('cid').value=clientId();$('ruri').textContent=redirectUri();$('off').value=S.offset;$('sinfo').value=S.infoDur;$('sanim').value=S.animDur;$('smo').checked=S.musicOver;$('sstyle').value=S.style;$('snight').checked=S.night;$('sns').value=S.ns;$('sne').value=S.ne;
 stat(tok.refresh?'Spotify bağlı ✓':'Spotify bağlı değil.',!!tok.refresh);$('settings').classList.add('show')}
function saveSettings(){var v=$('cid').value.trim();if(v&&v!==DEFAULT_CLIENT_ID)LS.set('clientId',v);else LS.del('clientId');
 S.offset=+$('off').value||0;LS.set('offset',S.offset);S.infoDur=clamp(+$('sinfo').value||10,5,120);LS.set('infoDur',S.infoDur);
 S.animDur=clamp(+$('sanim').value||25,5,600);LS.set('animDur',S.animDur);S.musicOver=$('smo').checked;LS.set('musicOver',S.musicOver?'1':'0');
 S.style=$('sstyle').value;LS.set('mstyle',S.style);document.body.classList.toggle('vinyl',S.style==='vinyl');
 S.night=$('snight').checked;LS.set('night',S.night?'1':'0');S.ns=clamp(+$('sns').value||0,0,23);S.ne=clamp(+$('sne').value||0,0,23);LS.set('ns',S.ns);LS.set('ne',S.ne)}
$('sConnect').addEventListener('click',function(e){e.stopPropagation();saveSettings();login()});
$('sLogout').addEventListener('click',function(e){e.stopPropagation();tok={};LS.del('tok');noTrack();stat('Bağlantı kesildi.');updTicker()});
$('sClose').addEventListener('click',function(e){e.stopPropagation();saveSettings();$('settings').classList.remove('show');poll()});
$('settings').addEventListener('click',function(e){e.stopPropagation()});

/* ================= DÖNGÜ ================= */
function resize(){W=innerWidth;H=innerHeight;U=Math.min(W,H)/100;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);X.setTransform(DPR,0,0,DPR,0,0);if(S.scene)initScene(S.scene)}
var last=0;
function loop(now){requestAnimationFrame(loop);if(now-last<(S.scene==='night'?100:32))return;var dt=Math.min(3,(now-last)/33.3);last=now;var t=now/1000,f=R[S.scene];
 if(f)f(t,dt);if(S.scene==='weather')updNeedle(t);if(S.scene==='music')updPlayback()}
function tick(){var d=new Date();$('tkc').textContent=hm(d);$('nclock').textContent=hm(d);
 if(S.scene==='night'){$('ninfo').textContent=(S.w?Math.round(S.w.t)+'°  ·  ':'')+d.toLocaleDateString('tr-TR',{weekday:'long'}).toUpperCase();if(d.getSeconds()===0){var n=$('nwrap');n.style.left=rnd(40,60)+'%';n.style.top=rnd(42,58)+'%'}}$('mclock').textContent=hm(d);$('wtime').textContent=hm(d)+' · '+d.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){wake();poll();loadWeather()}});
window.addEventListener('resize',resize);

document.body.classList.toggle('vinyl',S.style==='vinyl');
resize();tick();setInterval(tick,1000);
setInterval(function(){var w=wanted();if(w!==S.scene)go(w)},500);
setInterval(updTicker,60000);
loadWeather();setInterval(loadWeather,60*1000); // her dakika kontrol eder, ama sadece 15 dk dolunca istek atar
ensureDailyQuote();setInterval(ensureDailyQuote,60*1000); // günde bir kez API'den çeker, gün değişimini dakikada bir kontrol eder
updTicker();setScene(wanted());
flashHint('Menü için ekranın altına dokun');
handleRedirect().then(function(){updTicker();poll()});
requestAnimationFrame(loop);
})();
